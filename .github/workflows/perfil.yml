name: Atividade do perfil

# Redesenha o gráfico de atividade do README (.github/profile/render.mjs)
# e publica os SVGs no branch "output", que o README lê.
on:
  schedule:
    - cron: "23 9,21 * * *" # 06:23 e 18:23 em Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/profile/**
      - .github/workflows/perfil.yml

permissions:
  contents: write # publicar no branch output
  actions: write # reativar o agendamento, que o GitHub desliga após 60 dias sem atividade

concurrency:
  group: perfil
  cancel-in-progress: true

jobs:
  atividade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Gerar o gráfico
        run: node .github/profile/render.mjs atividade dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_LOGIN: ${{ github.repository_owner }}

      - name: Publicar no branch output
        working-directory: dist
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Atualiza o gráfico de atividade"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Manter o agendamento ativo
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/perfil.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
